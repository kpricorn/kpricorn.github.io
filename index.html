        t.textContent = new Date(a.d + 'T12:00:00Z').toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' });
        const k = document.createElementNS(NS, 'line');
        k.setAttribute('class', 'tick'); k.setAttribute('x1', gutter - 10); k.setAttribute('x2', gutter - 3); k.setAttribute('y1', y); k.setAttribute('y2', y);
        svg.append(t, k);
      }
    });
    const ax = (x, txt, anchor) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'axis'); t.setAttribute('x', x); t.setAttribute('y', H - 4); t.setAttribute('text-anchor', anchor);
      t.textContent = txt; svg.append(t);
    };
    ax(gutter, 'Start', 'start'); ax(W, 'Finish', 'end');
    ax(gutter + geo.w / 2, W < 520 ? 'each line one outing' : 'each line one outing, stretched start to finish', 'middle');

    hlFill = document.createElementNS(NS, 'path'); hlFill.setAttribute('class', 'hl-fill');
    hl = document.createElementNS(NS, 'path'); hl.setAttribute('class', 'hl');
    dot = document.createElementNS(NS, 'circle'); dot.setAttribute('class', 'dot'); dot.setAttribute('r', 3.5);
    svg.append(hlFill, hl, dot);
    box.replaceChildren(svg);
    pick(sel, false);
    first = false;
  }

  function pick(i, user = true) {
    sel = Math.max(0, Math.min(N - 1, i));
    const a = DATA[sel], pts = line(a, geo), y = geo.base(sel);
    document.documentElement.style.setProperty('--c', `var(--${a.k})`);
    const d = smooth(pts);
    hl.setAttribute('d', d);
    hlFill.setAttribute('d', d + `L${pts.at(-1)[0].toFixed(1)} ${y}L${geo.x0} ${y}Z`);
    const top = pts.reduce((m, p) => p[1] < m[1] ? p : m);
    dot.setAttribute('cx', top[0]); dot.setAttribute('cy', top[1]);
    const high = Math.max(...a.e);
    $('readout').innerHTML =
      `<span class="kind">${KIND[a.k]}</span><b>${day(a.d)}</b><span><b>${a.km.toFixed(1)}</b> km</span>` +
      `<span>↑ <b>${fmt(a.up)}</b> m</span><span>top <b>+${fmt(high)}</b> m</span>` +
      `<span>${sel === N - 1 ? 'latest' : `№ ${sel + 1} of ${N}`}</span>`;
  }

  box.addEventListener('pointermove', e => {
    const r = box.getBoundingClientRect(), y = e.clientY - r.top;
    pick(Math.round((y - geo.base(0)) / geo.gap));
  });
  box.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pick(N - 1); });
  box.addEventListener('keydown', e => {
    const step = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1, PageUp: -10, PageDown: 10 }[e.key];
    if (step) { e.preventDefault(); pick(sel + step); }
    if (e.key === 'Home') { e.preventDefault(); pick(0); }
    if (e.key === 'End') { e.preventDefault(); pick(N - 1); }
  });

  draw();
  let size = box.clientWidth + 'x' + box.clientHeight, rt;
  new ResizeObserver(() => {
    const now = box.clientWidth + 'x' + box.clientHeight;
    if (now === size) return;
    size = now; clearTimeout(rt); rt = setTimeout(draw, 80);
  }).observe(box);
})();
</script>
</body>
</html>
